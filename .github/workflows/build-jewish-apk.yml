name: Build Jewish App APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'jewish-app/**'
      - '.github/workflows/build-jewish-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install and test
        working-directory: jewish-app
        run: |
          npm ci
          npm test
      - name: Build web and Android project
        working-directory: jewish-app
        run: |
          node scripts/build.mjs
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android
      - name: Build signed APK
        working-directory: jewish-app/android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/keystore.jks"
          ./gradlew assembleRelease
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp jewish-app/android/app/build/outputs/apk/release/app-release.apk jewish-app.apk
          gh release delete jewish-app-latest --yes --cleanup-tag || true
          gh release create jewish-app-latest jewish-app.apk --title "אפליקציה יהודית APK" --notes "הגרסה האחרונה. לעדכון: מתקינים מעל הקיימת."
