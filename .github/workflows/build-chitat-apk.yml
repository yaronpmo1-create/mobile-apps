name: Build chitat yomi APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'limud-yomi/**'
      - 'android-chitat/**'
      - '.github/workflows/build-chitat-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files and Android project
        working-directory: android-chitat
        run: |
          npm install
          rm -rf www && mkdir www && cp -r ../limud-yomi/. www/
          npx cap add android
          npx cap sync android
          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" /><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" /><application#' $MF
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do cp www/icon-192.png "$d/$n.png"; done
          done
      - name: Build APK
        working-directory: android-chitat/android
        run: ./gradlew assembleDebug
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-chitat/android/app/build/outputs/apk/debug/app-debug.apk chitat-yomi.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest chitat-yomi.apk --title "חת\"ת יומי APK" --notes "Latest build"
